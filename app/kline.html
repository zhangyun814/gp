<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>股票 K 线查询</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js'"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17233b;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;padding:28px;min-height:100vh}.shell{max-width:1320px;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:25px;margin:0}.back{color:#2563eb;text-decoration:none;font-size:14px}.back:hover{text-decoration:underline}
    .card{background:#fff;border:1px solid #e4eaf2;border-radius:14px;box-shadow:0 5px 18px #17233b0a;padding:22px;margin-bottom:18px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{font-size:14px;color:#64748b}
    input,select,button{height:42px;border-radius:8px;border:1px solid #cbd5e1;font:inherit}input{padding:0 13px;font-size:15px}#keyword{width:300px}button{padding:0 17px;color:#fff;background:#1677ff;border-color:#1677ff;cursor:pointer;font-weight:600}button:hover{background:#0f63d4}button.secondary,.pager button{background:#e8effa;color:#29496f;border-color:#e8effa}button:disabled{cursor:not-allowed;opacity:.5}select{padding:0 10px;background:#fff;color:#334155}.hint{margin:11px 0 0;color:#64748b;font-size:13px}.error{color:#b42318!important}
    .searchbox{position:relative}.suggestions{position:absolute;left:0;top:47px;z-index:20;width:100%;max-height:280px;overflow:auto;background:#fff;border:1px solid #d7e0ec;border-radius:9px;box-shadow:0 7px 18px #17233b25;display:none}.suggestions button{display:block;width:100%;height:auto;padding:10px 12px;text-align:left;background:#fff;color:#334155;border:0;border-bottom:1px solid #edf1f6;border-radius:0;font-weight:400}.suggestions button:hover{background:#f1f6ff;color:#0f63d4}.suggestions small{color:#64748b;margin-left:8px}
    .table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.table-head h2,.chart-head h2{margin:0;font-size:20px}.table-wrap{overflow:auto;border:1px solid #e7edf4;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:11px 13px;border-bottom:1px solid #edf1f6;text-align:left;white-space:nowrap;font-size:13px}th{color:#64748b;background:#f8fafc;font-weight:600}tbody tr{cursor:pointer}tbody tr:hover{background:#f7faff}th button{height:auto;padding:0;background:none;border:0;color:#64748b;font-size:13px}th button:hover{background:none;color:#1677ff}.code-link{color:#1769d2;font-weight:600}.up{color:#dc2626}.down{color:#16a34a}.flat{color:#64748b}
    .pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;color:#64748b;font-size:13px}.pager button{height:36px;padding:0 13px}.pager input{width:72px;height:36px}.market-tabs,.rank-tabs,.periods{display:flex;gap:8px;flex-wrap:wrap;overflow:auto}.market-tabs{margin-bottom:12px}.rank-tabs{margin:4px 0 12px}.market-tabs button,.rank-tabs button,.periods button{height:36px;padding:0 16px;background:#eef3fa;color:#37567c;border-color:#eef3fa;font-size:13px;white-space:nowrap}.market-tabs button.active,.rank-tabs button.active,.periods button.active{background:#1677ff;color:#fff;border-color:#1677ff}.market-select{display:none}.stock-name{font-size:16px;font-weight:650;color:#17233b}.stock-code{margin-top:3px;color:#64748b;font-size:12px}.market-badge{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:4px;background:#eef3fa;color:#52729b;font-size:11px}.rank-price{font-size:16px;font-weight:650}.rank-gain{font-size:16px;font-weight:700}
    .quote-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:18px 0;flex-wrap:wrap}.name-line{display:flex;align-items:baseline;gap:10px}.name{font-size:23px;font-weight:700}.code{font-size:14px;color:#64748b}.price{font-size:29px;font-weight:700}.change{font-size:16px;margin-left:10px}.chart-wrap{position:relative;height:610px;border:1px solid #e7edf4;border-radius:10px;overflow:hidden;background:#fff}.chart{width:100%;height:100%}.tooltip{position:absolute;z-index:5;pointer-events:none;display:none;min-width:205px;padding:10px 12px;border:1px solid #d7e0ec;border-radius:8px;background:#fffffff2;box-shadow:0 4px 15px #17233b1c;font-size:12px;line-height:1.65;color:#334155}.tooltip strong{display:block;margin-bottom:4px;color:#17233b;font-size:13px}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;color:#64748b;font-size:12px}.loading{color:#2563eb}
    .signal-tools,.signal-legend{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.signal-tools{margin:14px 0}.signal-tools input{padding:0 10px}.signal-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f4f6fa;color:#475569;font-size:12px}.signal-chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--signal-color)}.signal-note{color:#d97706;font-weight:650}
    @media(max-width:680px){body{padding:14px}.card{padding:15px}.chart-wrap{height:500px}#keyword{width:230px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><h1>股票日线 K 线</h1><a class="back" href="/">返回观点分析首页</a></div>
    <section class="card">
      <div class="controls">
        <label for="keyword">股票搜索</label>
        <div class="searchbox"><input id="keyword" placeholder="输入代码或名称，例如 600519 / 贵州茅台" autocomplete="off" spellcheck="false"><div id="suggestions" class="suggestions"></div></div>
        <select id="market" class="market-select" aria-label="板块"><option value="all">全部板块</option><option value="main">主板</option><option value="gem">创业板</option><option value="star">科创板</option><option value="bse">北交所</option></select>
        <select id="adjust" aria-label="复权方式"><option value="qfq">前复权</option><option value="hfq">后复权</option><option value="none">不复权</option></select>
        <button id="query">查询</button>
      </div>
      <p id="status" class="hint">可输入股票代码或名称；列表默认按当前周期涨幅从高到低排列。</p>
    </section>

    <section class="card">
      <div class="market-tabs" id="market-tabs"><button data-market="all" class="active">A 股</button><button data-market="main">沪深主板</button><button data-market="bse">北交所</button><button data-market="gem">创业板</button><button data-market="star">科创板</button></div>
      <div class="rank-tabs" id="rank-tabs"><button data-sort="desc" class="active">涨幅榜</button><button data-sort="asc">跌幅榜</button></div>
      <div class="periods" id="periods"><button data-period="1d" class="active">今日</button><button data-period="3d">3 日</button><button data-period="5d">5 日</button><button data-period="10d">10 日</button><button data-period="20d">20 日</button><button data-period="60d">60 日</button><button data-period="mtd">月初至今</button><button data-period="ytd">年初至今</button></div>
      <div class="signal-tools"><label for="zzr-date">紫紫红信号日</label><input id="zzr-date" type="date"><button id="zzr-screen">紫紫红选股</button><span id="zzr-status" class="hint">留空表示数据库最新交易日</span></div>
      <div class="table-head"><h2>股票列表</h2><div class="controls"><span id="list-total" class="hint">—</span><label for="page-size">每页</label><select id="page-size"><option>100</option><option>200</option><option>500</option></select></div></div>
      <div class="table-wrap"><table><thead><tr><th>股票</th><th>板块</th><th>最新价</th><th><button id="sort-gain">当前周期涨跌幅 ↕</button></th><th>成交量</th><th>换手率</th><th>日期</th></tr></thead><tbody id="stock-rows"><tr><td colspan="7" class="hint">正在加载股票列表…</td></tr></tbody></table></div>
      <div class="pager"><button id="prev-page" class="secondary">上一页</button><span id="page-info">第 1 / 1 页</span><button id="next-page" class="secondary">下一页</button><label for="jump-page">跳转</label><input id="jump-page" type="number" min="1" placeholder="页码"><button id="jump" class="secondary">确定</button></div>
    </section>

    <section id="zzr-results" class="card" hidden>
      <div class="table-head"><h2>紫紫红选股结果</h2><span id="zzr-summary" class="hint"></span></div>
      <div class="table-wrap"><table><thead><tr><th>股票</th><th>板块</th><th>信号日期</th><th>收盘价</th><th>MOM</th><th>CMF</th><th>量比（5日）</th></tr></thead><tbody id="zzr-rows"></tbody></table></div>
    </section>

    <section class="card">
      <div class="chart-head"><h2 id="chart-title">股票 K 线</h2><div id="zzr-legend" class="signal-legend" hidden><span class="signal-chip" style="--signal-color:#7e22ce">趋势紫</span><span class="signal-chip" style="--signal-color:#d946ef">突破紫</span><span class="signal-chip" style="--signal-color:#dc2626">动能红</span><span id="zzr-count" class="signal-note"></span></div></div>
      <div id="quote-head" class="quote-head" hidden><div><div class="name-line"><span id="stock-name" class="name"></span><span id="stock-code" class="code"></span></div><div id="latest-date" class="hint"></div></div><div><span id="current-price" class="price"></span><span id="current-change" class="change"></span></div></div>
      <div class="chart-wrap"><div id="chart" class="chart"></div><div id="tooltip" class="tooltip"></div></div>
      <div class="foot"><span>红色上涨，绿色下跌；下方为成交量。周期 K 线由日线行情聚合。</span><span id="source">数据来源：PostgreSQL stock_daily_quote</span></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id), UP='#dc2626', DOWN='#16a34a';
    const state={period:'1d',page:1,pageSize:100,sort:'desc',code:'',daily:[]};
    let chart,candleSeries,volumeSeries,trendSeries,breakoutSeries,momentumSeries,resizeObserver,suggestTimer;
    const money=value=>value==null?'—':Number(value).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    const pct=value=>value==null?'—':`${value>=0?'+':''}${Number(value).toFixed(2)}%`;
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function showStatus(text,error=false){$('status').textContent=text;$('status').className='hint'+(error?' error':'')}
    function changeClass(value){return value>0?'up':value<0?'down':'flat'}
    function periodLabel(){return ({'1d':'日线','3d':'3日线','5d':'5日线','10d':'10日线','20d':'20日线','60d':'60日线',mtd:'月初至今',ytd:'年初至今'})[state.period]}
    function filterRange(items,period){if(!items.length||!['mtd','ytd'].includes(period))return items;const year=items[items.length-1].date.slice(0,4),month=items[items.length-1].date.slice(0,7);return items.filter(x=>period==='ytd'?x.date.startsWith(year):x.date.startsWith(month))}
    function aggregate(items,period){const range=filterRange(items,period);if(!range.length)return [];if(['mtd','ytd','1d'].includes(period))return range.map(x=>({...x,change_pct:x.change_pct}));const n=Number(period.slice(0,-1)),result=[];for(let i=0;i<range.length;i+=n){const group=range.slice(i,i+n),first=group[0],last=group[group.length-1],signals=group.map(x=>x.zzr||{});result.push({date:last.date,open:first.open,high:Math.max(...group.map(x=>x.high)),low:Math.min(...group.map(x=>x.low)),close:last.close,volume:group.reduce((sum,x)=>sum+(x.volume||0),0),change_pct:first.open?((last.close/first.open)-1)*100:null,zzr:{...last.zzr,trend_purple:signals.some(x=>x.trend_purple),breakout_purple:signals.some(x=>x.breakout_purple),momentum_red:signals.some(x=>x.momentum_red),signal:signals.some(x=>x.signal)}})}return result}
    function ensureChart(){if(chart)return true;if(!window.LightweightCharts){showStatus('图表库加载失败，请检查网络后刷新页面。',true);return false}const el=$('chart');chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:el.clientHeight,layout:{background:{color:'#fff'},textColor:'#64748b'},grid:{vertLines:{color:'#eef2f7'},horzLines:{color:'#eef2f7'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},rightPriceScale:{borderColor:'#d8e1ec'},timeScale:{borderColor:'#d8e1ec',timeVisible:false,secondsVisible:false}});candleSeries=chart.addCandlestickSeries({upColor:UP,downColor:DOWN,borderUpColor:UP,wickUpColor:UP,borderDownColor:DOWN,wickDownColor:DOWN,priceFormat:{type:'price',precision:2,minMove:.01}});trendSeries=chart.addHistogramSeries({priceScaleId:'zzr',base:0,color:'#7e22ce',lastValueVisible:false,priceLineVisible:false});breakoutSeries=chart.addHistogramSeries({priceScaleId:'zzr',base:1,color:'#d946ef',lastValueVisible:false,priceLineVisible:false});momentumSeries=chart.addHistogramSeries({priceScaleId:'zzr',base:2,color:'#dc2626',lastValueVisible:false,priceLineVisible:false});trendSeries.priceScale().applyOptions({scaleMargins:{top:.72,bottom:.16}});volumeSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:''});volumeSeries.priceScale().applyOptions({scaleMargins:{top:.86,bottom:0}});const tooltip=$('tooltip'),byDate=new Map();chart.subscribeCrosshairMove(param=>{const data=param.seriesData.get(candleSeries);if(!data||!param.point||param.point.x<0||param.point.y<0){tooltip.style.display='none';return}const item=byDate.get(String(data.time));if(!item){tooltip.style.display='none';return}const toNow=item.close&&chart.__latestClose?((chart.__latestClose/item.close)-1)*100:null,z=item.zzr||{};tooltip.innerHTML=`<strong>${esc(item.date)} · ${periodLabel()}</strong><div>开盘 ${money(item.open)}　最高 ${money(item.high)}</div><div>最低 ${money(item.low)}　收盘 ${money(item.close)}</div><div>当期涨幅 <span class="${changeClass(item.change_pct)}">${pct(item.change_pct)}</span></div><div>至今涨幅 <span class="${changeClass(toNow)}">${pct(toNow)}</span></div><div>趋势紫 ${z.trend_purple?'是':'否'}　突破紫 ${z.breakout_purple?'是':'否'}　动能红 ${z.momentum_red?'是':'否'}</div><div>MOM ${money(z.mom)}　CMF ${money(z.cmf)}　量比 ${money(z.volume_ratio)}</div>${z.signal?'<div class="signal-note">当日触发紫紫红</div>':''}`;tooltip.style.display='block';const left=Math.min(Math.max(8,param.point.x+14),el.clientWidth-tooltip.offsetWidth-8),top=Math.min(Math.max(8,param.point.y-20),el.clientHeight-tooltip.offsetHeight-8);tooltip.style.left=`${left}px`;tooltip.style.top=`${top}px`});chart.__byDate=byDate;resizeObserver=new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight}));resizeObserver.observe(el);return true}
    function renderChart(){if(!state.daily.length||!ensureChart())return;const items=aggregate(state.daily,state.period);const candles=items.map(x=>({time:x.date,open:x.open,high:x.high,low:x.low,close:x.close}));const volumes=items.map(x=>({time:x.date,value:x.volume||0,color:x.close>=x.open?UP:DOWN}));candleSeries.setData(candles);volumeSeries.setData(volumes);trendSeries.setData(items.filter(x=>x.zzr?.trend_purple).map(x=>({time:x.date,value:1})));breakoutSeries.setData(items.filter(x=>x.zzr?.breakout_purple).map(x=>({time:x.date,value:2})));momentumSeries.setData(items.filter(x=>x.zzr?.momentum_red).map(x=>({time:x.date,value:3})));const markers=items.filter(x=>x.zzr?.signal).map(x=>({time:x.date,position:'aboveBar',color:'#f59e0b',shape:'arrowDown',text:'紫紫红'}));candleSeries.setMarkers(markers);chart.__byDate.clear();items.forEach(x=>chart.__byDate.set(x.date,x));chart.timeScale().fitContent();const latest=items[items.length-1];chart.__latestClose=latest.close;const first=items[0];const periodChange=['mtd','ytd'].includes(state.period)&&first.open?((latest.close/first.open)-1)*100:latest.change_pct;$('chart-title').textContent=`${$('stock-name').textContent||'股票'} K 线`;$('current-price').textContent=money(latest.close);const change=$('current-change');change.textContent=pct(periodChange);change.className='change '+changeClass(periodChange);$('latest-date').textContent=`最新交易日：${latest.date} · ${periodLabel()}`;$('quote-head').hidden=false;$('zzr-legend').hidden=false;$('zzr-count').textContent=markers.length?`历史触发 ${markers.length} 次`:'历史未触发';$('source').textContent=`数据来源：PostgreSQL stock_daily_quote · ${$('adjust').selectedOptions[0].text}`}
    async function fetchSuggestions(keyword,chooseFirst=false){const params=new URLSearchParams({keyword,market:$('market').value,limit:'12'});const res=await fetch(`/api/stocks/search?${params}`);if(!res.ok)throw new Error('股票搜索失败');const rows=await res.json();const box=$('suggestions');box.innerHTML=rows.map(row=>`<button type="button" data-code="${esc(row.code)}" data-name="${esc(row.name)}">${esc(row.code)} · ${esc(row.name)}<small>${esc(row.market)}</small></button>`).join('');box.style.display=rows.length?'block':'none';box.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{state.code=btn.dataset.code;$('keyword').value=btn.dataset.code;box.style.display='none';query(btn.dataset.code)});if(chooseFirst&&rows[0])return rows[0].code;return rows[0]?.code||''}
    async function loadHistory(code){const params=new URLSearchParams({limit:'2000',adjust_type:$('adjust').value});const res=await fetch(`/api/quotes/history/${encodeURIComponent(code)}?${params}`);const data=await res.json();if(!res.ok)throw new Error(data.detail||'读取行情失败');if(!data.items?.length)throw new Error('该股票暂无行情数据');state.code=data.code;state.daily=data.items;$('keyword').value=data.code;$('stock-name').textContent=data.name||'未命名股票';$('stock-code').textContent=data.code;renderChart();showStatus(`已加载 ${data.name||data.code}，共 ${data.items.length} 个交易日，紫紫红触发 ${data.zzr_signal_count||0} 次`)}
    async function query(forcedCode=''){const text=$('keyword').value.trim();if(!text&&!forcedCode){showStatus('请输入股票代码或名称。',true);return}showStatus('正在读取行情…');try{let code=forcedCode;if(!code){const exact=text.toUpperCase().replace(/[.\s-]/g,'');const codeMatch=text.match(/(?:^|\D)(\d{6})(?:\D|$)/);if(/^\d{6}$/.test(exact))code=exact;else if(codeMatch)code=codeMatch[1];else code=await fetchSuggestions(text,true)}if(!code)throw new Error('没有找到匹配的股票');$('suggestions').style.display='none';await loadHistory(code);state.page=1;await loadStockList()}catch(error){$('quote-head').hidden=true;showStatus(error.message,true)}}
    async function loadStockList(){const params=new URLSearchParams({keyword:$('keyword').value.trim(),market:$('market').value,period:state.period,page:String(state.page),page_size:String(state.pageSize),sort:state.sort,adjust_type:$('adjust').value});const res=await fetch(`/api/stocks/market-list?${params}`);const data=await res.json();if(!res.ok)throw new Error(data.detail||'股票列表加载失败');$('list-total').textContent=`共 ${data.total} 只`;const pages=Math.max(1,Math.ceil(data.total/state.pageSize));$('page-info').textContent=`第 ${Math.min(state.page,pages)} / ${pages} 页`;$('prev-page').disabled=state.page<=1;$('next-page').disabled=state.page>=pages;$('stock-rows').innerHTML=data.items.length?data.items.map(item=>`<tr data-code="${esc(item.code)}"><td><div class="stock-name">${esc(item.name||'—')}</div><div class="stock-code">${esc(item.code)}<span class="market-badge">${esc(item.market)}</span></div></td><td>${esc(item.market)}</td><td class="rank-price">${money(item.current_price)}</td><td class="rank-gain ${changeClass(item.change_pct)}">${pct(item.change_pct)}</td><td>${item.volume==null?'—':Number(item.volume).toLocaleString('zh-CN')}</td><td>${item.turnover_rate==null?'—':Number(item.turnover_rate).toFixed(2)+'%'}</td><td>${esc(item.latest_date||'—')}</td></tr>`).join(''):'<tr><td colspan="7" class="hint">没有匹配的股票或行情数据</td></tr>';$('stock-rows').querySelectorAll('tr[data-code]').forEach(row=>row.onclick=()=>{$('keyword').value=row.dataset.code;query(row.dataset.code)})}
    async function runZzrScreen(){const button=$('zzr-screen');button.disabled=true;$('zzr-status').className='hint';$('zzr-status').textContent='正在扫描全市场日线…';try{const params=new URLSearchParams({market:$('market').value,page_size:'500',adjust_type:$('adjust').value});if($('zzr-date').value)params.set('signal_date',$('zzr-date').value);const res=await fetch(`/api/strategies/zzr/screen?${params}`);const data=await res.json();if(!res.ok)throw new Error(data.detail||'紫紫红扫描失败');$('zzr-results').hidden=false;$('zzr-summary').textContent=`${data.signal_date||'—'} · 扫描 ${data.scanned} 只 · 触发 ${data.total} 只`;$('zzr-status').textContent=`${data.signal_date||'—'} 共 ${data.total} 只触发`;const rows=$('zzr-rows');rows.innerHTML=data.items.length?data.items.map(item=>`<tr data-code="${esc(item.code)}"><td><div class="stock-name">${esc(item.name||'—')}</div><div class="stock-code">${esc(item.code)}</div></td><td>${esc(item.market)}</td><td>${esc(item.signal_date)}</td><td>${money(item.close)}</td><td>${money(item.mom)}</td><td>${money(item.cmf)}</td><td>${money(item.volume_ratio)}</td></tr>`).join(''):'<tr><td colspan="7" class="hint">该交易日没有股票首次触发紫紫红</td></tr>';rows.querySelectorAll('tr[data-code]').forEach(row=>row.onclick=()=>query(row.dataset.code));$('zzr-results').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){$('zzr-status').textContent=error.message;$('zzr-status').className='hint error'}finally{button.disabled=false}}
    $('query').onclick=()=>query();$('zzr-screen').onclick=runZzrScreen;$('keyword').onkeydown=e=>{if(e.key==='Enter')query()};$('keyword').oninput=()=>{clearTimeout(suggestTimer);suggestTimer=setTimeout(()=>fetchSuggestions($('keyword').value.trim()).catch(()=>{}),250)};$('market').onchange=()=>{document.querySelectorAll('#market-tabs button').forEach(btn=>btn.classList.toggle('active',btn.dataset.market===$('market').value));state.page=1;loadStockList().catch(e=>showStatus(e.message,true));if($('keyword').value.trim())fetchSuggestions($('keyword').value.trim()).catch(()=>{})};$('adjust').onchange=()=>{if(state.code)loadHistory(state.code).catch(e=>showStatus(e.message,true));loadStockList().catch(e=>showStatus(e.message,true))};$('page-size').onchange=()=>{state.pageSize=Number($('page-size').value);state.page=1;loadStockList().catch(e=>showStatus(e.message,true))};$('prev-page').onclick=()=>{if(state.page>1){state.page--;loadStockList().catch(e=>showStatus(e.message,true))}};$('next-page').onclick=()=>{state.page++;loadStockList().catch(e=>showStatus(e.message,true))};$('jump').onclick=()=>{const page=Math.max(1,Number($('jump-page').value)||1);state.page=page;loadStockList().catch(e=>showStatus(e.message,true))};$('jump-page').onkeydown=e=>{if(e.key==='Enter')$('jump').click()};$('sort-gain').onclick=()=>{state.sort=state.sort==='desc'?'asc':'desc';document.querySelectorAll('#rank-tabs button').forEach(btn=>btn.classList.toggle('active',btn.dataset.sort===state.sort));loadStockList().catch(e=>showStatus(e.message,true))};document.querySelectorAll('#periods button').forEach(btn=>btn.onclick=()=>{state.period=btn.dataset.period;document.querySelectorAll('#periods button').forEach(item=>item.classList.toggle('active',item===btn));loadStockList().catch(e=>showStatus(e.message,true));renderChart()});document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))$('suggestions').style.display='none'});loadStockList().catch(e=>showStatus(e.message,true));
    document.querySelectorAll('#market-tabs button').forEach(btn=>btn.onclick=()=>{$('market').value=btn.dataset.market;$('market').dispatchEvent(new Event('change'))});document.querySelectorAll('#rank-tabs button').forEach(btn=>btn.onclick=()=>{state.sort=btn.dataset.sort;document.querySelectorAll('#rank-tabs button').forEach(item=>item.classList.toggle('active',item===btn));loadStockList().catch(e=>showStatus(e.message,true))});
  </script>
</body>
