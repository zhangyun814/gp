services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planet_stock
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet_stock"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://planet:planet@postgres:5432/planet_stock}
      KNOWLEDGE_PLANET_TOKEN: ${KNOWLEDGE_PLANET_TOKEN:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-csv}
      MARKET_DATA_CSV: ${MARKET_DATA_CSV:-/data/quotes.csv}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
volumes:
  postgres_data:
